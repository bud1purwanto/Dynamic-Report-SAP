services:
  dynamic-report:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumina-dynamic-report
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8087}:8000"
    env_file:
      - .env
    environment:
      APP_PORT: "8000"
      APP_HOST: "0.0.0.0"
      # Database Configuration
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi di .env}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-dynamic_report}

      # Centralized Identity (OIDC) & MCP Gateway
      DASHBOARD_OIDC_ISSUER: ${DASHBOARD_OIDC_ISSUER:?DASHBOARD_OIDC_ISSUER wajib diisi di .env}
      DASHBOARD_MCP_API_TOKEN: ${DASHBOARD_MCP_API_TOKEN:?DASHBOARD_MCP_API_TOKEN wajib diisi di .env}
      DASHBOARD_MCP_GATEWAY_URL: ${DASHBOARD_MCP_GATEWAY_URL:?DASHBOARD_MCP_GATEWAY_URL wajib diisi di .env}

      # Session & Security
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-24}
      SCHEDULE_DELEGATION_DAYS: ${SCHEDULE_DELEGATION_DAYS:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sap_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      EXPORT_MASK_FIELDS: ${EXPORT_MASK_FIELDS:-IBAN,BANKN,BANKL,STCD1,STCD2}

      # Optional LLM / Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}

      # AI LLM Providers (9Router Primary & OpenRouter Fallback)
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://192.168.88.83:20128/v1}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-Lumina-Dynamic-Report}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-openrouter/free}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lumina-net

networks:
  lumina-net:
    driver: bridge
